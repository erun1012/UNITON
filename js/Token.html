<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>푸시 토큰 테스트</title>
  <style>
    body { max-width: 500px; margin: 2rem auto; font-family: Arial, sans-serif; }
    input, button { width: 100%; margin: 0.5rem 0; padding: 0.5rem; font-size: 1rem; }
    #result { white-space: pre-wrap; background: #f4f4f4; padding: 1rem; border-radius: 4px; min-height: 150px; }
  </style>
</head>
<body>
  <h1>푸시 토큰 저장 및 조회 테스트</h1>

  <label for="userIdInput">사용자 아이디 (users 컬렉션 name 필드 값)</label>
  <input type="text" id="userIdInput" placeholder="예: testuser22" />

  <label for="tokenInput">푸시 토큰 (FCM 토큰)</label>
  <input type="text" id="tokenInput" placeholder="예: abc123def456..." />

  <label for="platformInput">플랫폼</label>
  <input type="text" id="platformInput" placeholder="android, ios, web 중 하나" />

  <button id="saveTokenBtn">푸시 토큰 저장/업데이트</button>
  <button id="loadTokensBtn">활성 토큰 조회</button>

  <h2>결과</h2>
  <pre id="result"></pre>

  <script type="module">
    import { upsertDeviceToken, getActiveTokensByUserId } from './Token.js';

    const userIdInput = document.getElementById('userIdInput');
    const tokenInput = document.getElementById('tokenInput');
    const platformInput = document.getElementById('platformInput');
    const saveTokenBtn = document.getElementById('saveTokenBtn');
    const loadTokensBtn = document.getElementById('loadTokensBtn');
    const result = document.getElementById('result');

    saveTokenBtn.addEventListener('click', async () => {
      const userId = userIdInput.value.trim();
      const token = tokenInput.value.trim();
      const platform = platformInput.value.trim();

      if (!userId || !token || !platform) {
        alert('모든 필드를 입력하세요.');
        return;
      }

      saveTokenBtn.disabled = true;
      saveTokenBtn.textContent = '저장 중...';

      try {
        const success = await upsertDeviceToken({ userId, token, platform });
        if (success) {
          result.textContent = `✅ 푸시 토큰 저장/업데이트 성공\n사용자: ${userId}\n플랫폼: ${platform}\n토큰: ${token}`;
        } else {
          result.textContent = '❌ 푸시 토큰 저장/업데이트 실패';
        }
      } catch (e) {
        result.textContent = '❌ 오류 발생: ' + e.message;
      } finally {
        saveTokenBtn.disabled = false;
        saveTokenBtn.textContent = '푸시 토큰 저장/업데이트';
      }
    });

    loadTokensBtn.addEventListener('click', async () => {
      const userId = userIdInput.value.trim();

      if (!userId) {
        alert('사용자 아이디를 입력하세요.');
        return;
      }

      loadTokensBtn.disabled = true;
      loadTokensBtn.textContent = '조회 중...';

      try {
        const tokens = await getActiveTokensByUserId(userId);
        if (tokens.length === 0) {
          result.textContent = '⚠️ 활성화된 토큰이 없습니다.';
        } else {
          result.textContent = JSON.stringify(tokens, null, 2);
        }
      } catch (e) {
        result.textContent = '❌ 오류 발생: ' + e.message;
      } finally {
        loadTokensBtn.disabled = false;
        loadTokensBtn.textContent = '활성 토큰 조회';
      }
    });
  </script>
</body>
</html>
