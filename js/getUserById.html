<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>사용자 검색 테스트</title>
</head>
<body>
  <h1>사용자 검색</h1>
  <input type="text" id="nameInput" placeholder="검색할 아이디(name) 입력" />
  <button id="searchBtn">검색</button>
  <pre id="result"></pre>

  <script type="module">
    import { getUserById } from './User.js';

    const nameInput = document.getElementById('nameInput');
    const searchBtn = document.getElementById('searchBtn');
    const resultArea = document.getElementById('result');

    searchBtn.addEventListener('click', async () => {
      const name = nameInput.value.trim();
      if (!name) {
        alert('아이디(name)를 입력하세요');
        return;
      }

      resultArea.textContent = '검색 중...';

      try {
        const user = await getUserById(name);
        if (user) {
          resultArea.textContent = JSON.stringify(user, null, 2);
        } else {
          resultArea.textContent = '❌ 사용자를 찾을 수 없습니다.';
        }
      } catch (e) {
        resultArea.textContent = '⚠ 오류 발생: ' + e.message;
      }
    });
  </script>
</body>
</html>
