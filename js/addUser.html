<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Firebase Test</title>
</head>
<body>
  <h1>Firebase Firestore 테스트</h1>
  <button id="addUserBtn">사용자 추가</button>
  <button id="loginBtn">로그인</button>

  <script type="module">
    import { addUser, loginUser } from './User.js';

    // 사용자 추가 버튼
    document.getElementById('addUserBtn').addEventListener('click', async () => {
      try {
        // User.js에서 요구하는 필드에 맞게 값 전달
        await addUser({
          name: 'testuser11',         // 사용자 아이디
          email: 'testuser22@test.com',
          password: '123422',
          role: '이용자',
          phone: '010-1234-5678'
        });
        alert('사용자 추가 성공!');
      } catch (e) {
        alert('사용자 추가 실패: ' + e.message);
      }
    });

    // 로그인 버튼
    document.getElementById('loginBtn').addEventListener('click', async () => {
      try {
        const result = await loginUser('testuser11', '123422');
        console.log('로그인 결과:', result);
        if (result && result.length > 0) {
          alert('로그인 성공!');
        } else {
          alert('로그인 실패!');
        }
      } catch (e) {
        alert('로그인 중 오류 발생: ' + e.message);
      }
    });
  </script>
</body>
</html>
