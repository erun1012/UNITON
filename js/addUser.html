<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Firebase Test</title>
</head>
<body>
  <h1>Firebase Firestore 테스트</h1>
  <button id="addUserBtn">사용자 추가</button>
  <button id="loginBtn">로그인</button>

  <script type="module">
    import { addUser, loginUser } from './User.js';

    document.getElementById('addUserBtn').addEventListener('click', async () => {
      try {
        await addUser({ userId: 'testuser22', userPw: '123422' });
        alert('사용자 추가 성공!');
      } catch (e) {
        alert('사용자 추가 실패: ' + e.message);
      }
    });

    document.getElementById('loginBtn').addEventListener('click', async () => {
      try {
        const result = await loginUser('testuser22', '123422');
        console.log('로그인 결과:', result);
        if (result) {
          alert('로그인 성공!');
        } else {
          alert('로그인 실패!');
        }
      } catch (e) {
        alert('로그인 중 오류 발생: ' + e.message);
      }
    });
  </script>
</body>
</html>
